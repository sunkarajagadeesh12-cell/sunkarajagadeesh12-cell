<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="8" viewBox="0 0 1000 8" role="img" aria-label="Animated divider line">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00E5FF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#00E5FF"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="0" y="3" width="1000" height="2" fill="#1E3A8A" opacity="0.5"/>
  <rect y="2" width="320" height="4" rx="2" fill="url(#g)">
    <animate attributeName="x" from="-320" to="1000" dur="3s" repeatCount="indefinite"/>
  </rect>
</svg>